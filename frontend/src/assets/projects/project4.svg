<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="p4-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="p4-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="chart-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="p4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#p4-bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="180" x2="1120" y2="180" />
    <line x1="80" y1="300" x2="1120" y2="300" />
    <line x1="80" y1="420" x2="1120" y2="420" />
    <line x1="80" y1="540" x2="1120" y2="540" />
    <line x1="280" y1="120" x2="280" y2="600" />
    <line x1="560" y1="120" x2="560" y2="600" />
    <line x1="840" y1="120" x2="840" y2="600" />
  </g>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="65" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
  <circle cx="45" cy="32" r="12" fill="#06b6d4" />
  <text x="70" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">InsightOps</text>
  <rect x="165" y="24" width="75" height="18" rx="9" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3"/>
  <text x="177" y="37" fill="#06b6d4" font-family="system-ui" font-size="10" font-weight="600">LIVE SYNC</text>

  <!-- User / Status Badge in Header -->
  <rect x="1000" y="20" width="150" height="26" rx="6" fill="#1e293b"/>
  <circle cx="1018" cy="33" r="4" fill="#10b981" />
  <text x="1030" y="37" fill="#cbd5e1" font-family="system-ui" font-size="11" font-weight="500">Clusters: Healthy</text>

  <!-- 3 Metric KPI Cards -->
  <g transform="translate(60, 90)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="340" height="110" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">AVG LATENCY (REST / WS)</text>
    <text x="25" y="75" fill="#f8fafc" font-family="system-ui" font-size="32" font-weight="800">18.4 ms</text>
    <path d="M 230 75 Q 260 45 290 60 T 320 40" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#p4-glow)"/>
    <text x="25" y="96" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">↓ 14% vs last hour</text>

    <!-- KPI 2 -->
    <rect x="370" y="0" width="340" height="110" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="395" y="35" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">THROUGHPUT</text>
    <text x="395" y="75" fill="#f8fafc" font-family="system-ui" font-size="32" font-weight="800">142.8k</text>
    <text x="510" y="75" fill="#64748b" font-family="system-ui" font-size="16" font-weight="500">req/min</text>
    <path d="M 600 70 Q 630 80 660 50 T 690 45" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#p4-glow)"/>
    <text x="395" y="96" fill="#10b981" font-family="system-ui" font-size="11" font-weight="600">↑ 22% peak capacity</text>

    <!-- KPI 3 -->
    <rect x="740" y="0" width="340" height="110" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="765" y="35" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">DATABASE IOPS &amp; HEALTH</text>
    <text x="765" y="75" fill="#f8fafc" font-family="system-ui" font-size="32" font-weight="800">99.98%</text>
    <circle cx="1025" cy="55" r="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <text x="1013" y="60" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">OK</text>
    <text x="765" y="96" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="500">PostgreSQL Replica Active</text>
  </g>

  <!-- Big Interactive Area Chart Card -->
  <g transform="translate(60, 225)">
    <rect x="0" y="0" width="710" height="400" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Chart Header -->
    <text x="30" y="40" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Network Traffic &amp; Microservice Events</text>
    <text x="30" y="62" fill="#64748b" font-family="system-ui" font-size="12">Real-time telemetry ingested via WebSockets &amp; Redis Streams</text>

    <!-- Chart Canvas Area -->
    <g transform="translate(30, 90)">
      <!-- Area Fill -->
      <polygon points="0,240 60,190 120,210 180,140 240,160 300,90 360,130 420,70 480,110 540,50 600,80 650,40 650,260 0,260" fill="url(#chart-glow)"/>
      <!-- Glowing Line -->
      <polyline points="0,240 60,190 120,210 180,140 240,160 300,90 360,130 420,70 480,110 540,50 600,80 650,40" fill="none" stroke="#06b6d4" stroke-width="3.5" filter="url(#p4-glow)"/>
      
      <!-- Purple secondary line -->
      <polyline points="0,250 60,230 120,220 180,200 240,190 300,160 360,170 420,130 480,150 540,110 600,120 650,90" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4"/>

      <!-- Data Point Highlight -->
      <circle cx="420" cy="70" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <rect x="375" y="15" width="90" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="390" y="32" fill="#94a3b8" font-family="system-ui" font-size="9">Peak Volume</text>
      <text x="390" y="45" fill="#f8fafc" font-family="system-ui" font-size="11" font-weight="700">4,810 req/s</text>

      <!-- Time Axis -->
      <text x="0" y="280" fill="#64748b" font-family="system-ui" font-size="10">00:00</text>
      <text x="130" y="280" fill="#64748b" font-family="system-ui" font-size="10">04:00</text>
      <text x="260" y="280" fill="#64748b" font-family="system-ui" font-size="10">08:00</text>
      <text x="390" y="280" fill="#64748b" font-family="system-ui" font-size="10">12:00</text>
      <text x="520" y="280" fill="#64748b" font-family="system-ui" font-size="10">16:00</text>
      <text x="630" y="280" fill="#64748b" font-family="system-ui" font-size="10">NOW</text>
    </g>
  </g>

  <!-- Side Panel: Active Services & Alert Feed -->
  <g transform="translate(800, 225)">
    <rect x="0" y="0" width="340" height="400" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <text x="25" y="40" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="700">Microservice Mesh</text>
    <text x="25" y="60" fill="#64748b" font-family="system-ui" font-size="11">Docker Containers &amp; Endpoints</text>

    <!-- Service Row 1 -->
    <g transform="translate(20, 80)">
      <rect width="300" height="60" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="30" r="5" fill="#10b981" />
      <text x="42" y="27" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">auth-service (OAuth &amp; JWT)</text>
      <text x="42" y="45" fill="#94a3b8" font-family="system-ui" font-size="10">Port 8081 • Node.js / Express</text>
      <rect x="235" y="20" width="50" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="246" y="34" fill="#10b981" font-family="system-ui" font-size="10" font-weight="700">99.9%</text>
    </g>

    <!-- Service Row 2 -->
    <g transform="translate(20, 150)">
      <rect width="300" height="60" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="30" r="5" fill="#10b981" />
      <text x="42" y="27" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">order-payment-worker</text>
      <text x="42" y="45" fill="#94a3b8" font-family="system-ui" font-size="10">Port 8082 • FastAPI / Python</text>
      <rect x="235" y="20" width="50" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="246" y="34" fill="#10b981" font-family="system-ui" font-size="10" font-weight="700">100%</text>
    </g>

    <!-- Service Row 3 -->
    <g transform="translate(20, 220)">
      <rect width="300" height="60" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="30" r="5" fill="#06b6d4" />
      <text x="42" y="27" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">websocket-gateway</text>
      <text x="42" y="45" fill="#94a3b8" font-family="system-ui" font-size="10">Port 9000 • Socket.io / Redis</text>
      <rect x="235" y="20" width="50" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="246" y="34" fill="#06b6d4" font-family="system-ui" font-size="10" font-weight="700">SYNC</text>
    </g>

    <!-- Service Row 4 -->
    <g transform="translate(20, 290)">
      <rect width="300" height="85" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="20" y="25" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="700">⚡ Automated Alert Rule</text>
      <text x="20" y="48" fill="#cbd5e1" font-family="system-ui" font-size="11">Latency spike triggers scale out</text>
      <text x="20" y="68" fill="#64748b" font-family="system-ui" font-size="10">Auto-healing Kubernetes worker initialized</text>
    </g>
  </g>
</svg>
